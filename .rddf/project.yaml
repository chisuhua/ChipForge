      version: v0.7.0
      status: completed                  # archived 2026-09-25
    wave3-mmu-real-memory-and-cycle:
      version: v0.8.0
      status: partially_completed        # P1#3 ✓, P1#4/P1#6 🗑, P1#5 superseded
    wave4-csr-cache-dse:
      version: v0.9.0
      status: deferred                    # phase-1.5-wave-4 placeholder
    wave5-isa-coverage-and-bp:
      version: v0.11.0
