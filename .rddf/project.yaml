# 模板文件 (per AGENTS.md "新会话第一件事" 速查表)
onboarding:
  ai_config_files:
    - AGENTS.md
    - .cursorrules
  entry_points:
    - AGENTS.md                           # 第一件事: 项目速查
    - .rddf/roadmap.md              # 路线图导航
    - .rddf/roadmap.md                    # rdd-workflow 实施入口

# Reporting (ADR-0027 feedback loop) — opt-in, default off per AGENTS.md
reporting:
  enabled: false
  destination: github
  gh_repo: chisuhua/chipforge             # 假设 (待确认实际仓库 owner)
  auto_submit: false
  submit_categories: {}                   # 空 = 全部 opt-out
  close_on_archive: true
  retention_days: 30
