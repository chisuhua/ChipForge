    wave6-linux-and-productization:
      version: v1.0.0+
      status: deferred                    # vexii-riscv-parity-poc placeholder
  active_changes:                         # 2026-10-08 清理后
    - mmu-chmem-pipeline-integration      # 6/166, Phase A 已 commit a3afcfa
    - mfc-cpu-pipeline-multi-cycle-fsm    # 50/60, v0.10.0 收官版
    - mfc-extract-fsm-h                   # 0/20, 等 mfc-fsm Phase H archive
    - phase-1.5-wave-4                    # 0/51, wave4 启动期
    - vexii-riscv-parity-poc              # 0/74, wave6 远期
  archived_changes:                       # 2026-10-08 清理
