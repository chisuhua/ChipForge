name: Architecture Gates (ADR / D4 / Portability / XLEN hygiene / TLM freeze / Coverage ledger / Doc Links)

# 本 workflow 是 PR 强制门禁: 4 个架构验证脚本任一失败 → exit 1 → 阻止 PR merge
# 引用文档: docs/architecture/adr.md ADR-043
# 设计来源: .omo/drafts/fix-plan-2026-06-12-design.md §3 Change 4

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '**/*.{h,cpp,cu,cuh,cc,cxx,hpp}'
      - '**/*.md'
      - '**/*.json'
      - '**/*.sh'
      - 'bundles/**'
      - 'ip/**'
      - 'src/cf_plugin/**'
      - 'soc/**'
      - 'tools/**'
      - 'docs/architecture/**'
      - 'docs/roadmap/**'

jobs:
  toolchain-sanity:
    runs-on: ubuntu-latest
    name: Phase 6d Toolchain Sanity (RISC-V + Verilator)
    # Phase 6d prereqs (Oracle 2026-09-20 修订): 与 architecture-gates 并行运行
    # 仅 warn-only (默认), 不阻塞 PR; Phase 6d.5 Verilator 集成是真正阻断点
    env:
      CHIPFORGE_ROOT: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect distribution
        id: distro
        run: |
          DISTRO_VERSION=$(lsb_release -rs 2>/dev/null || grep -oP 'VERSION_ID="\K[^"]+' /etc/os-release)
          echo "VERSION_ID=$DISTRO_VERSION" >> $GITHUB_OUTPUT
          echo "Detected Ubuntu $DISTRO_VERSION"

      # RISC-V 工具链 (所有发行版)
      - name: Install RISC-V toolchain (gcc-riscv64-unknown-elf)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf
          riscv64-unknown-elf-gcc --version | head -1

      # ★ ★ Verilator 安装：apt 优先 + 源码兜底（★ **不再按发行版字符串分流**）
      #   ★ 2026-11-08 实测修正（原实现按 `VERSION_ID == '24.04'` / `'22.04'` 精确匹配
      #   ⇒ 发行版一变就**两个分支都 skip** ⇒ 静默无 Verilator ⇒ 后续 sanity 步骤莫名失败）
      #   ⇒ 与 `parity-gate.yml` 的同名步骤**同款**修法（★ 两个 workflow 曾有同一个坑）。
      - name: Install Verilator (apt, fallback to source build)
        run: |
          set -euo pipefail
          . /etc/os-release
          echo "distro: ${PRETTY_NAME:-unknown} (VERSION_ID=${VERSION_ID:-unknown})"
          sudo apt-get update -qq
          if sudo apt-get install -y verilator && verilator --version; then
            echo "verilator installed from apt"
          else
            echo "apt verilator unavailable ⇒ building v5.020 from source"
            sudo apt-get install -y git cmake make flex bison g++ help2man perl
            git clone --depth 1 --branch v5.020 https://github.com/verilator/verilator.git /tmp/verilator
            cmake -S /tmp/verilator -B /tmp/verilator/build
            cmake --build /tmp/verilator/build -j"$(nproc)"
            sudo cmake --install /tmp/verilator/build
            verilator --version
          fi

      # yosys/iverilog 标 optional, 不阻塞 (Oracle descope)
      # Sanity 1: RISC-V 编译 trivial .S
      # ★ ★ 2026-11-08 首次 PR 路径实测修正（原命令**从未成功过** ⇒ 该 workflow 此前从未在 PR 上跑过）：
      #   ① 缺 `-T link_add.ld` ⇒ `add.S` 的 `tohost` 符号未定义 ⇒ 链接失败
      #      （★ `add.S` 自己的头注释就写着两段式：`as` → `ld -T link_add.ld`）
      #   ② 缺 `-nostartfiles` ⇒ Ubuntu 的 `gcc-riscv64-unknown-elf` **无 ilp32 multilib**
      #      ⇒ 链接器去找不存在的 ilp32 `crt0.o` ⇒ `undefined reference`
      #   ③ 缺 `-Wl,-e,_start` ⇒ `add.S` 自带 `_start`（`.global _start`）且不用 crt ⇒ 需显式入口
      #   ★ 本地双侧实测：riscv64-unknown-elf-gcc 与 riscv32-unknown-elf-gcc 均链接通过
      #     ⇒ ELF32 / RISC-V / Entry 0x80000000
      - name: Sanity — RISC-V cross-compile manual_elf/add.S
        run: |
          riscv64-unknown-elf-gcc -march=rv32i -mabi=ilp32 -nostdlib -nostartfiles \
            -Wl,-e,_start -T tests/cpu/manual_elf/link_add.ld \
            -o /tmp/add.elf tests/cpu/manual_elf/add.S
          file /tmp/add.elf
        # ★ 本 job 声明为「仅 warn-only, 不阻塞 PR」⇒ 失败 MUST NOT 让 PR 变红
        continue-on-error: true

      # Sanity 2: Verilator lint 一个 minimal stub (Phase 6d.5 真正集成时改为真 .v)
      - name: Sanity — Verilator lint minimal stub
        # ★ `if: always()`：★ Sanity 1 失败时本步仍要跑（★ 否则少一条独立信息）
        if: always()
        continue-on-error: true
        run: |
          printf 'module hello(input wire a, input wire b, output wire sum);\n  assign sum = a ^ b;\nendmodule\n' > /tmp/hello.v
          verilator --lint-only /tmp/hello.v

      - name: Summary
        if: always()
        run: |
          echo "=== Toolchain Sanity Summary ==="
          echo "OS: Ubuntu ${{ steps.distro.outputs.VERSION_ID }}"
          echo "riscv64-unknown-elf-gcc: $(riscv64-unknown-elf-gcc --version 2>&1 | head -1 || echo 'NOT INSTALLED')"
          echo "verilator: $(verilator --version 2>&1 | head -1 || echo 'NOT INSTALLED')"

  architecture-gates:
    runs-on: ubuntu-latest
    name: Architecture Compliance Gates (ADR / D4 / Portability / Truth purity / Exception provenance / Doc Links)

    env:
      # CHIPFORGE_ROOT 覆盖脚本默认值 (本地 dev 路径) 为 CI workspace 路径
      CHIPFORGE_ROOT: ${{ github.workspace }}
      CPPTLM_REPO: ${{ vars.CPPTLM_REPO || 'chisuhua/CppTLM' }}
      CPPHDL_REPO: ${{ vars.CPPHDL_REPO || 'chisuhua/CppHDL' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # ★ fetch-depth 0：S-12 provenance 机检需要 base..HEAD 的**完整 commit 历史**
          #   （要逐个 commit 判定 message 是否引 ADR-089）⇒ depth=1 会让 git log 截断
          fetch-depth: 0

      - name: Checkout CppTLM (for verify_adr.sh framework path validation)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CPPTLM_REPO }}
          path: ${{ github.workspace }}/CppTLM

      - name: Checkout CppHDL (for verify_adr.sh framework path validation)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CPPHDL_REPO }}
          path: ${{ github.workspace }}/CppHDL

      - name: Run ADR verification (verify_adr.sh)
        id: verify_adr
        run: |
          echo "=== Running verify_adr.sh ==="
          echo "CHIPFORGE_ROOT=$CHIPFORGE_ROOT"
          ls -la "$CHIPFORGE_ROOT/CppTLM" "$CHIPFORGE_ROOT/CppHDL" 2>&1 | head -10
          bash tools/verify_adr.sh
        continue-on-error: false

      - name: Run D4 Plugin-style check (verify_plugin_decision.sh)
        id: verify_d4
        run: |
          echo "=== Running verify_plugin_decision.sh ==="
          bash tools/verify_plugin_decision.sh
        continue-on-error: false

      - name: Run ADR-040 Portability check (check_plugin_portability.sh)
        id: verify_portability
        run: |
          echo "=== Running check_plugin_portability.sh ==="
          bash tools/check_plugin_portability.sh
        continue-on-error: false

      - name: Check XLEN hygiene (check_xlen_hygiene.sh, warn-only per ADR-087 D6)
        id: verify_xlen_hygiene
        run: |
          echo "=== Running check_xlen_hygiene.sh ==="
          bash tools/check_xlen_hygiene.sh
        continue-on-error: true

      - name: Check TLM freeze (check_tlm_freeze.sh, warn-level per ADR-088 §2)
        id: verify_tlm_freeze
        run: |
          echo "=== Running check_tlm_freeze.sh ==="
          bash tools/check_tlm_freeze.sh
        continue-on-error: true

      - name: Check coverage parity ledger (check_coverage_parity_ledger.sh, warn-level)
        id: verify_coverage_parity_ledger
        run: |
          echo "=== Running check_coverage_parity_ledger.sh ==="
          bash tools/check_coverage_parity_ledger.sh
        continue-on-error: true

      # ★ S-12 白名单**扩张**的 provenance 机检（契约 `parity-gate-contract.md` §S-12）
      #   ★ 契约 v1.4 曾诚实标注「『commit message 引裁决编号』的机检**不在覆盖内**（需 git hook 级检查）
      #     ⇒ 登记为 A4 的待办，★ **MUST NOT 假装已覆盖**」⇒ ★ 2026-11-08 补上（ADR-089 D3 裁决）
      #   ★ 判据：例外条目 id 集合变大（= 扩张）⇒ 触及该文件的**每个单亲 commit** 的 message MUST 引 ADR-089
      - name: Check parity exception provenance (S-12, ADR-089 D3 expansion gate)
        id: verify_exception_provenance
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          echo "=== Running check_exception_provenance.py ==="
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then
            echo "SKIP: PR base sha 不可得"
            exit 0
          fi
          python3 tools/parity/check_exception_provenance.py --range "$BASE...HEAD"
        continue-on-error: false

      # ADR-088 §5.2 判据 4「CI 有可回归的自动测试」: CI **不跑 ctest** =>
      # 仅加 ctest entry 不满足该判据 => 必须有 CI 门禁步骤实跑测量脚本做基线漂移检测.
      - name: Check CH_MEM perf baseline (measure_perf.sh, warn-level)
        id: verify_perf_baseline
        run: |
          echo "=== Running measure_perf.sh --check-baseline ==="
          if [ ! -x build/bin/cpu_verilator_sim ]; then
            echo "SKIP: build/bin/cpu_verilator_sim 不存在 (未构建 CH_MEM binary)"
            exit 0
          fi
          if [ ! -f build/dhrystone.elf ]; then
            echo "SKIP: build/dhrystone.elf 不存在 (CMake 目标 dhrystone_elf 未产出)"
            exit 0
          fi
          bash tools/measure_perf.sh --check-baseline
        continue-on-error: true

      # 分支微基准基线 (chmem-branch-microbench) —— B1 ② (BP) 的中间验收载体
      - name: Check CH_MEM branchbench baseline (measure_branchbench.sh, warn-level)
        id: verify_branchbench_baseline
        run: |
          echo "=== Running measure_branchbench.sh --check-baseline ==="
          if [ ! -x build/bin/cpu_verilator_sim ]; then
            echo "SKIP: build/bin/cpu_verilator_sim 不存在 (未构建 CH_MEM binary)"
            exit 0
          fi
          if [ ! -f build/branchbench_m0.elf ]; then
            echo "SKIP: build/branchbench_m0.elf 不存在 (CMake 目标 branchbench_elfs 未产出)"
            exit 0
          fi
          bash tools/measure_branchbench.sh --check-baseline
        continue-on-error: true

      - name: Run Doc link check (doc_link_check.sh)
        id: verify_doc_links
        run: |
          echo "=== Running doc_link_check.sh ==="
          bash tools/doc_link_check.sh --quiet
        continue-on-error: false

      # ★ 门禁①④（ADR-095 §2.5①④ · change architecture-truth-boundary-enforcement）
      #   ① 顶层 docs/architecture/*.md 不得出现实施态时点语汇（「现在长什么样」不进真相源）
      #   ④ 顶层引用 mixed/ / archive/ 下的文档时必须标「非权威 · 仅作背景」
      #   ★ 阻塞级：顶层纯净是 ADR-095 的核心治理约束，破一条顶层就会二次变脏
      - name: Check architecture truth purity (check_arch_truth.sh)
        id: verify_arch_truth
        run: |
          echo "=== Running check_arch_truth.sh (gate 1 + gate 4) ==="
          bash tools/check_arch_truth.sh
        continue-on-error: false

      - name: Summary (always)
        if: always()
        run: |
          echo "=== Architecture Gates Summary ==="
          echo "verify_adr.sh:        ${{ steps.verify_adr.outcome }}"
          echo "verify_plugin_decision.sh:  ${{ steps.verify_d4.outcome }}"
          echo "check_plugin_portability.sh: ${{ steps.verify_portability.outcome }}"
          echo "doc_link_check.sh:         ${{ steps.verify_doc_links.outcome }}"
